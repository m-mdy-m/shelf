name: Shelf CI

on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: shelf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: echo "quality job"

  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: echo "structure job"

  git_flow:
    name: Git flow
    runs-on: ubuntu-latest
    steps:
      - name: Smoke
        run: echo "git flow job"
