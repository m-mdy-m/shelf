name: Shelf CI

on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: shelf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pipeline quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch pinned Pipeline source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/m-mdy-m/pipeline.git .pipeline
          git -C .pipeline checkout --detach f4e05487193a653ecb96cd09f9a6b2da7ba4822

      - name: Run Shelf task graph
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
        run: python -m pipeline.providers.github task ci --root "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/pipeline.toml" --json
