name: Shelf CI

on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check out the shared Pipeline runner
        uses: actions/checkout@v7
        with:
          repository: m-mdy-m/pipeline
          ref: f4e05487193a653ecb96cd09f9a6b2da7ba4822
          path: .pipeline
          persist-credentials: false

      - name: Run Shelf task graph
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
        run: python -m pipeline.providers.github task ci --root "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/pipeline.toml" --json
