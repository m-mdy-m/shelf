name: Shelf CI

on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: shelf-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pipeline and application quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Fetch pinned Pipeline source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/m-mdy-m/pipeline.git .pipeline
          git -C .pipeline checkout --detach f4e05487193a653ecb96cd09f9a6b2da7ba4822
      - name: Run Shelf task graph
        env:
          PYTHONPATH: ${{ github.workspace }}/.pipeline/src
        run: python -m pipeline.providers.github task ci --root "$GITHUB_WORKSPACE" --config "$GITHUB_WORKSPACE/pipeline.toml" --json

  project_standards:
    name: PSX and GIX project standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.0"
          cache: false
      - name: Fetch pinned PSX source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/m-mdy-m/PSX.git .tools/psx
          git -C .tools/psx checkout --detach e4f12e85725e1ebd44c7f3a4e18fcbaa893b30df
      - name: Build and run PSX
        working-directory: .tools/psx
        run: go build -trimpath -o "$RUNNER_TEMP/psx" ./cmd/psx
      - name: Verify Shelf structure
        run: |
          "$RUNNER_TEMP/psx" fix --dry-run
          "$RUNNER_TEMP/psx" check
          git diff --exit-code
      - name: Fetch pinned GIX source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/m-mdy-m/gix.git .tools/gix
          git -C .tools/gix checkout --detach 9f0867923177cef3cd36d980cc2b356a35bee507
      - name: Build and validate GIX flow
        working-directory: .tools/gix
        run: |
          go build -trimpath -o "$RUNNER_TEMP/gix" ./cmd/gix
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gix" config list
      - name: Test modular Reader backend
        working-directory: backend
        run: go test ./...
